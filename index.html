<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WIns Delivery</title>
<link rel="icon" href="assets/app-icon.png">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<meta name="theme-color" content="#1F1A12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#shop" id="brand" aria-label="WIns"></a>
    <button class="loc-chip" id="locChip" data-action="open-loc" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span class="loc-chip-text"><small data-i18n="deliverTo">Deliver to</small><b id="locLabel">Set location</b></span>
    </button>
    <label class="search" for="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="search" type="search" data-i18n-ph="searchPh" placeholder="Search groceries, electronics, home…" autocomplete="off">
    </label>
    <nav class="nav" aria-label="Main">
      <a href="#shop" data-route="shop" data-i18n="navShop">Shop</a>
      <a href="#orders" data-route="orders" data-i18n="navOrders">My orders</a>
      <a href="#admin" data-route="admin" data-i18n="navAdmin">Admin</a>
    </nav>
    <div class="top-actions">
      <button class="lang-btn" id="langBtn" data-action="toggle-lang" type="button"></button>
      <button class="cart-btn" id="cartBtn" data-action="open-cart" type="button" data-i18n-aria="openCart" aria-label="Open cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H6.4"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<main>
  <section id="view-shop" class="view"></section>
  <section id="view-orders" class="view" hidden></section>
  <section id="view-admin" class="view" hidden>
    <div class="admin" id="adminShell">
      <aside class="admin-panel">
        <div class="tabs" role="tablist" id="adminTabs"></div>
        <div id="adminBody" class="admin-body"></div>
      </aside>
      <div class="admin-map-wrap" id="adminMapWrap">
        <div id="adminMap" class="map"></div>
        <div class="map-hint" id="mapHint"></div>
      </div>
    </div>
  </section>
</main>

<div class="scrim" id="scrim" hidden data-action="close-cart"></div>
<aside class="drawer" id="drawer" aria-label="Cart" hidden></aside>

<div class="modal" id="locModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="locTitle">
    <div class="modal-head">
      <div>
        <h2 id="locTitle" data-i18n="locTitle">Where should we deliver?</h2>
        <p class="muted" data-i18n="locSub">We find your zone and the store that serves it automatically.</p>
      </div>
      <button class="icon-btn" data-action="close-loc" type="button" data-i18n-aria="close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="loc-actions">
        <button class="btn btn-brand" data-action="use-gps" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          <span data-i18n="useGps">Use my current location</span>
        </button>
        <span class="muted small" id="gpsStatus" data-i18n="gpsHint">Or tap the map to drop a pin.</span>
      </div>
      <div class="samples" id="samples"></div>
      <div id="locMap" class="map loc-map"></div>
      <div class="loc-preview" id="locPreview"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-action="close-loc" type="button" data-i18n="cancel">Cancel</button>
      <button class="btn btn-brand" data-action="loc-confirm" id="locConfirm" type="button" disabled data-i18n="deliverHere">Deliver here</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
